# Production Deployment to Cloudflare Pages (damianflynn.com)
#
# This workflow builds and deploys the production version of the site
# Excludes drafts, expired, and future content
# Uses stable theme version from go.mod

name: Deploy Production

on:
  # Triggers when changes are pushed to the main branch
  push:
    branches: [main]
  # Triggers when a webhook is received from the garden repository with new content
  repository_dispatch:
    types: [garden-content-update]
  # Runs daily at midnight to refresh content from the source
  schedule:
    - cron: '0 0 * * *'  # Run at midnight daily
  # Allows manual triggering of the workflow
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy-production:
    name: Build and Deploy Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://damianflynn.com
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.2'
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true

      - name: Configure Git for Private Modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          echo "✅ Git configured to use PAT for private repos"
        env:
          GOPRIVATE: github.com/DamianFlynn/*

      - name: Install Hugo Modules
        env:
          GOPRIVATE: github.com/DamianFlynn/*
          GIT_TERMINAL_PROMPT: "0"
        run: |
          echo "📦 Clearing Hugo cache to force re-authentication..."
          rm -rf ~/.cache/hugo_cache
          echo ""
          echo "📦 Downloading Go modules to populate cache..."
          go mod download
          echo ""
          echo "🔍 Checking Go module cache:"
          ls -la ~/go/pkg/mod/github.com/\!damian\!flynn/ 2>/dev/null || echo "No modules in Go cache yet"
          echo ""
          echo "📦 Installing Hugo modules..."
          hugo mod tidy
          echo ""
          echo "🔄 Updating garden content to latest..."
          hugo mod get -u github.com/DamianFlynn/garden
          echo ""
          echo "📊 Module Graph:"
          hugo mod graph
          echo ""
          echo "🔍 Module versions:"
          grep "github.com/DamianFlynn" go.mod
          echo ""
          echo "🔍 Verifying theme in Go module cache:"
          THEME_DIR=$(find ~/go/pkg/mod/github.com/\!damian\!flynn/ -type d -name "hugo-haptic-theme*" 2>/dev/null | head -1)
          if [ -n "$THEME_DIR" ]; then
            echo "✅ Found theme at: $THEME_DIR"
            ls -la "$THEME_DIR/" | head -20
            echo ""
            echo "🔍 Checking for layouts directory:"
            if [ -d "$THEME_DIR/layouts" ]; then
              echo "✅ Layouts directory exists!"
              ls -la "$THEME_DIR/layouts/" | head -10
            else
              echo "❌ No layouts directory in Go module cache"
            fi
          else
            echo "❌ Theme not found in Go module cache"
          fi
      
      - name: Validate Content
        run: |
          echo "🔍 Checking for content issues..."
          # This will fail if there are duplicate keys or other issues
          hugo --ignoreCache --quiet || echo "⚠️  Build warnings detected"
        continue-on-error: true
        
      - name: Build Production Site
        run: hugo --minify --gc --ignoreCache
        env:
          HUGO_ENV: production

      - name: Deploy to Cloudflare Pages
        run: |
          npm install -g wrangler
          # Create the project once; an existing project is not an error.
          wrangler pages project create damianflynn --production-branch=main || true
          set -o pipefail
          OUTPUT=$(wrangler pages deploy public --project-name=damianflynn --branch=main --commit-dirty=true 2>&1 | tee /dev/stderr)
          if echo "$OUTPUT" | grep -qE "\[ERROR\]|Authentication error|Invalid access token"; then
            echo "::error::Cloudflare Pages deploy failed; check CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
